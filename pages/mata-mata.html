<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://kit.fontawesome.com/2cd34b61aa.js" crossorigin="anonymous"></script>
    <title>Mata-Mata - Prode 254</title>
</head>
<body id="final-page">
        <div class="heading">
            <h1>Fase Final (Mata-Mata)</h1>
            <h3>Completa los cuadros. Los ganadores avanzarán automáticamente.</h3>
        </div>

        <button onclick="window.location.href='dashboard.html'" class="btn-volver">
        <i class="fa-solid fa-arrow-left"></i> Volver al Panel
    </button>

        <div id="faseNav">
            
        </div>

        <section id="clasificacionGrupos" class="dashboard-main" style="margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
        <h2 style="background-color: var(--sananto-black); color: var(--sananto-white); padding: 15px; border-radius: 15px 15px 0 0; text-align: center; font-size: 1.3rem;">1. Seleccioná los Clasificados</h2>
        <div style="background-color: var(--sananto-white); padding: 20px; border-radius: 0 0 15px 15px; border: 2px solid var(--sananto-black); border-top: none;">
            <p style="text-align: center; font-size: 0.95rem; margin-bottom: 25px; font-weight: 500;">
                Tocá los países para definir quién sale 1°, 2° y 3° en cada grupo.<br>
                <span style="color: var(--sananto-red); font-size: 0.85rem;">(Los cruces y mejores terceros se armarán automáticamente abajo)</span>
            </p>
            <div id="gridGruposClasificacion" class="countries-container" style="justify-content: center; gap: 20px;"></div>
        </div>
    </section>
        
    <section>
        <div id="bracketContainer">
            
        </div>

        <button id="btnGuardarMataMata" class="button">Guardar Fase Final 🏆</button> 

        <div id="bracket">
        </div>
    </section>

    <script src="../js/mata-mata.js"></script>
    <script src="../js/bracket.js"></script>
